# Build and publish to GitHub Pages on every push to main.
#
# The tests run before the deploy on purpose. This tool's whole claim is that
# the record is being kept, so a build that fails the rationale-gate or
# append-only-history tests must never reach the URL organisations rely on.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # Both values are public by design: the anon key grants nothing on its
        # own, because every table is governed by Row Level Security. Absent,
        # the build still works and ships with only the no-account local mode.
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Fail if the build would contact a third party
        # SPEC 10 — private by architecture. Checks loadable subresources, not
        # bare URL strings: the SDK contains documentation links in its error
        # messages, and a check that cannot tell those from a fetch gets
        # switched off the first time it cries wolf.
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: node scripts/check-no-external.mjs dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
