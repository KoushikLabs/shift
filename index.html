<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Shift — stakeholder tracker</title>
<meta name="description" content="Map stakeholders, score them with written reasoning, and set a named engagement strategy for each. Scores, reasoning and strategy are versioned together, so you can see which approach moved whom and when. Use it without an account, stored only in your browser, or sign in to keep your organisation’s maps in its own private storage.">

<!-- Installable web app. All optional: if these 404 (a bare single-file deploy),
     the app runs exactly the same, just without offline support and the
     Install button. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shift">
<meta name="theme-color" content="#F3F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1319" media="(prefers-color-scheme: dark)">

<!-- No Open Graph or Twitter tags, and no analytics of any kind. This page is a
     tool for private strategy data, not something to be indexed with a preview. -->
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<div class="wrap" id="app">
  <noscript>
    <h1>Shift</h1>
    <p>This tool runs entirely in your browser and needs JavaScript enabled. Nothing is sent anywhere — the
       JavaScript is what does the work locally, not what phones home.</p>
  </noscript>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
